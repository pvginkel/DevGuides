# The dev-guides.home site: the hub's index page and root llms.txt at /, and each guide under its
# own /<path>/ (tools/build_hub.py, Dockerfile). TLS is terminated by the estate's nginx layer in
# front of this pod, so this serves plain HTTP on :80, the port DevGuidesDeploy's Service sends
# traffic to.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The guides use directory URLs, so `/pipelines/guide/pod` 301s to `/pipelines/guide/pod/`.
    # nginx builds that redirect absolute from this pod's own scheme, plain http behind the TLS
    # edge; relative, it is the path alone.
    absolute_redirect off;

    # The llms.txt files, the llms-full.txt files and the pages' .md copies are UTF-8 text.
    # mime.types has no .md, which would otherwise go out as application/octet-stream.
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript;

    location ~ \.md$ {
        types { }
        default_type text/markdown;
    }
}
