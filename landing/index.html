<!doctype html>
<!--
  The page served at https://dev-guides.home/, the hub's index: tools/build_hub.py fills in one card
  per guide where the guides marker stands, and writes the result to out/index.html beside the
  guides, which is what the relative links resolve to. build_hub.py fails on a link that resolves
  to nothing in out/. Every other file in this folder is copied to out/ as it is.
  Self-contained on purpose: no asset outside this folder.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev guides</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="describedby" href="llms.txt" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #222;
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      a {
        color: #3f51b5;
      }
      .guide h2 {
        margin-bottom: 0.25rem;
      }
      .guide p {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dev guides</h1>
      <p>
        Rules and guidelines for agents, one guide per subsite. For agents,
        <a href="llms.txt">llms.txt</a> lists every guide's own llms.txt.
      </p>
      <!-- guides -->
    </main>
  </body>
</html>
